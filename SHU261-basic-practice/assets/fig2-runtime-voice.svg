<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif">
  <defs>
    <linearGradient id="rt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1180" height="600" fill="#f8fafc"/>

  <text x="590" y="46" fill="#0f172a" font-size="27" font-weight="700" text-anchor="middle">运行时动态语音流程与延迟构成</text>
  <text x="590" y="74" fill="#64748b" font-size="14" text-anchor="middle">预制语音无法覆盖的台词改由运行时生成，每个环节都会累积延迟</text>

  <!-- stage boxes -->
  <g>
    <rect x="30" y="108" width="168" height="96" rx="10" fill="url(#rt)"/>
    <text x="114" y="144" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">触发条件</text>
    <text x="114" y="170" fill="#ccfbf1" font-size="12" text-anchor="middle">玩家行为</text>
    <text x="114" y="188" fill="#ccfbf1" font-size="12" text-anchor="middle">或任务状态变化</text>
  </g>
  <g>
    <rect x="228" y="108" width="168" height="96" rx="10" fill="url(#rt)"/>
    <text x="312" y="144" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">文本生成</text>
    <text x="312" y="170" fill="#ccfbf1" font-size="12" text-anchor="middle">由语言模型</text>
    <text x="312" y="188" fill="#ccfbf1" font-size="12" text-anchor="middle">产出待朗读文本</text>
  </g>
  <g>
    <rect x="426" y="108" width="168" height="96" rx="10" fill="url(#rt)"/>
    <text x="510" y="144" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">文本规范化</text>
    <text x="510" y="170" fill="#ccfbf1" font-size="12" text-anchor="middle">数字 · 单位</text>
    <text x="510" y="188" fill="#ccfbf1" font-size="12" text-anchor="middle">多音字 · 变量</text>
  </g>
  <g>
    <rect x="624" y="108" width="168" height="96" rx="10" fill="url(#rt)"/>
    <text x="708" y="144" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">语音合成</text>
    <text x="708" y="170" fill="#ccfbf1" font-size="12" text-anchor="middle">按角色音色模型</text>
    <text x="708" y="188" fill="#ccfbf1" font-size="12" text-anchor="middle">流式产出音频</text>
  </g>
  <g>
    <rect x="822" y="108" width="168" height="96" rx="10" fill="url(#rt)"/>
    <text x="906" y="144" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">传输与缓冲</text>
    <text x="906" y="170" fill="#ccfbf1" font-size="12" text-anchor="middle">送入音频系统</text>
    <text x="906" y="188" fill="#ccfbf1" font-size="12" text-anchor="middle">并做播放准备</text>
  </g>
  <g>
    <rect x="1020" y="108" width="130" height="96" rx="10" fill="url(#rt)"/>
    <text x="1085" y="144" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">中间件播出</text>
    <text x="1085" y="170" fill="#ccfbf1" font-size="12" text-anchor="middle">响度与空间化</text>
    <text x="1085" y="188" fill="#ccfbf1" font-size="12" text-anchor="middle">统一处理</text>
  </g>

  <line x1="200" y1="156" x2="226" y2="156" stroke="#0f766e" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="398" y1="156" x2="424" y2="156" stroke="#0f766e" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="596" y1="156" x2="622" y2="156" stroke="#0f766e" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="794" y1="156" x2="820" y2="156" stroke="#0f766e" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="992" y1="156" x2="1018" y2="156" stroke="#0f766e" stroke-width="2" marker-end="url(#ar2)"/>

  <line x1="114" y1="204" x2="114" y2="246" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="312" y1="204" x2="312" y2="246" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="510" y1="204" x2="510" y2="246" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="708" y1="204" x2="708" y2="246" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="906" y1="204" x2="906" y2="246" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="1085" y1="204" x2="1085" y2="246" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- latency row -->
  <g>
    <rect x="30" y="248" width="168" height="128" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="114" y="276" fill="#475569" font-size="13" font-weight="700" text-anchor="middle">延迟来源</text>
    <text x="114" y="304" fill="#334155" font-size="12" text-anchor="middle">本身几乎不耗时</text>
    <text x="114" y="336" fill="#64748b" font-size="11" text-anchor="middle">可提前预判</text>
    <text x="114" y="356" fill="#64748b" font-size="11" text-anchor="middle">提前触发生成</text>
  </g>
  <g>
    <rect x="228" y="248" width="168" height="128" rx="10" fill="#fee2e2" stroke="#ef4444"/>
    <text x="312" y="276" fill="#991b1b" font-size="13" font-weight="700" text-anchor="middle">延迟最大</text>
    <text x="312" y="304" fill="#b91c1c" font-size="12" text-anchor="middle">数百毫秒至数秒</text>
    <text x="312" y="336" fill="#dc2626" font-size="11" text-anchor="middle">使用小模型</text>
    <text x="312" y="356" fill="#dc2626" font-size="11" text-anchor="middle">预生成常见语句</text>
  </g>
  <g>
    <rect x="426" y="248" width="168" height="128" rx="10" fill="#dcfce7" stroke="#22c55e"/>
    <text x="510" y="276" fill="#166534" font-size="13" font-weight="700" text-anchor="middle">延迟很小</text>
    <text x="510" y="304" fill="#15803d" font-size="12" text-anchor="middle">十毫秒量级</text>
    <text x="510" y="336" fill="#16a34a" font-size="11" text-anchor="middle">本地规则处理</text>
    <text x="510" y="356" fill="#16a34a" font-size="11" text-anchor="middle">避免网络往返</text>
  </g>
  <g>
    <rect x="624" y="248" width="168" height="128" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="708" y="276" fill="#92400e" font-size="13" font-weight="700" text-anchor="middle">延迟较大</text>
    <text x="708" y="304" fill="#a16207" font-size="12" text-anchor="middle">首包数百毫秒</text>
    <text x="708" y="336" fill="#ca8a04" font-size="11" text-anchor="middle">流式合成</text>
    <text x="708" y="356" fill="#ca8a04" font-size="11" text-anchor="middle">边生成边播放</text>
  </g>
  <g>
    <rect x="822" y="248" width="168" height="128" rx="10" fill="#dcfce7" stroke="#22c55e"/>
    <text x="906" y="276" fill="#166534" font-size="13" font-weight="700" text-anchor="middle">延迟中等</text>
    <text x="906" y="304" fill="#15803d" font-size="12" text-anchor="middle">数十毫秒</text>
    <text x="906" y="336" fill="#16a34a" font-size="11" text-anchor="middle">本地推理</text>
    <text x="906" y="356" fill="#16a34a" font-size="11" text-anchor="middle">或就近部署</text>
  </g>
  <g>
    <rect x="1020" y="248" width="130" height="128" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="1085" y="276" fill="#475569" font-size="13" font-weight="700" text-anchor="middle">播出侧</text>
    <text x="1085" y="304" fill="#334155" font-size="12" text-anchor="middle">取决于素材</text>
    <text x="1085" y="336" fill="#64748b" font-size="11" text-anchor="middle">预加载常用片段</text>
    <text x="1085" y="356" fill="#64748b" font-size="11" text-anchor="middle">复用已生成结果</text>
  </g>

  <!-- latency bar -->
  <text x="30" y="412" fill="#334155" font-size="13" font-weight="700">玩家感知的等待时间 = 上述各环节延迟之和</text>
  <rect x="30" y="424" width="1120" height="34" rx="6" fill="#e2e8f0"/>
  <rect x="228" y="424" width="168" height="34" fill="#fca5a5"/>
  <rect x="426" y="424" width="168" height="34" fill="#86efac"/>
  <rect x="624" y="424" width="168" height="34" fill="#fcd34d"/>
  <rect x="822" y="424" width="168" height="34" fill="#86efac"/>
  <text x="114" y="447" fill="#475569" font-size="11" text-anchor="middle">触发</text>
  <text x="312" y="447" fill="#7f1d1d" font-size="11" text-anchor="middle">文本生成（占比最大）</text>
  <text x="510" y="447" fill="#14532d" font-size="11" text-anchor="middle">规范化</text>
  <text x="708" y="447" fill="#78350f" font-size="11" text-anchor="middle">语音合成（占比次之）</text>
  <text x="906" y="447" fill="#14532d" font-size="11" text-anchor="middle">传输</text>
  <text x="1085" y="447" fill="#475569" font-size="11" text-anchor="middle">播出</text>

  <rect x="30" y="484" width="1120" height="88" rx="10" fill="#0f172a"/>
  <text x="590" y="514" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">常见遮掩手段：让角色先播出一段短的前置语音，用这段时间覆盖后续生成延迟</text>
  <text x="590" y="542" fill="#cbd5e1" font-size="13" text-anchor="middle">前置语音的音色与响度必须与后续内容一致，否则玩家会听出拼接痕迹</text>
</svg>
