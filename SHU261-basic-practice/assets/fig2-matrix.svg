<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1180" height="720" fill="#f8fafc"/>

  <text x="590" y="48" fill="#0f172a" font-size="29" font-weight="700" text-anchor="middle">生成模式 × 音频方向：交叉应用矩阵</text>
  <text x="590" y="76" fill="#64748b" font-size="15" text-anchor="middle">同一套模型底座，换一种输入条件，就打开了新的游戏音频场景</text>

  <!-- header row -->
  <rect x="250" y="108" width="220" height="46" fill="#0ea5e9"/>
  <text x="360" y="137" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Voice</text>
  <rect x="470" y="108" width="220" height="46" fill="#8b5cf6"/>
  <text x="580" y="137" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Music</text>
  <rect x="690" y="108" width="220" height="46" fill="#f59e0b"/>
  <text x="800" y="137" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">SFX</text>
  <rect x="910" y="108" width="220" height="46" fill="#10b981"/>
  <text x="1020" y="137" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">系统 / 管线</text>

  <!-- row labels -->
  <rect x="30" y="154" width="220" height="120" fill="#e2e8f0"/>
  <text x="140" y="200" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">Text-to-Speech</text>
  <text x="140" y="226" fill="#475569" font-size="12" text-anchor="middle">文本 → 语音</text>
  <text x="140" y="248" fill="#475569" font-size="12" text-anchor="middle">TTS</text>

  <rect x="30" y="274" width="220" height="120" fill="#e2e8f0"/>
  <text x="140" y="320" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">Text-to-Audio / Music</text>
  <text x="140" y="346" fill="#475569" font-size="12" text-anchor="middle">文本 → 音频</text>
  <text x="140" y="368" fill="#475569" font-size="12" text-anchor="middle">TTA / TTM</text>

  <rect x="30" y="394" width="220" height="120" fill="#e2e8f0"/>
  <text x="140" y="440" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">Video-to-Audio</text>
  <text x="140" y="466" fill="#475569" font-size="12" text-anchor="middle">视频 → 同步音频</text>
  <text x="140" y="488" fill="#475569" font-size="12" text-anchor="middle">V2A</text>

  <rect x="30" y="514" width="220" height="120" fill="#e2e8f0"/>
  <text x="140" y="560" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">Audio-to-Audio</text>
  <text x="140" y="586" fill="#475569" font-size="12" text-anchor="middle">音频 → 音频</text>
  <text x="140" y="608" fill="#475569" font-size="12" text-anchor="middle">A2A</text>

  <!-- Voice column -->
  <rect x="250" y="154" width="220" height="120" fill="#e0f2fe"/>
  <text x="360" y="192" fill="#075985" font-size="13" text-anchor="middle">主要场景</text>
  <text x="360" y="220" fill="#0c4a6e" font-size="13" text-anchor="middle">对白 · 播报 · 旁白</text>
  <text x="360" y="246" fill="#0c4a6e" font-size="13" text-anchor="middle">多语言本地化配音</text>

  <rect x="250" y="274" width="220" height="120" fill="#f1f5f9"/>
  <text x="360" y="340" fill="#94a3b8" font-size="14" text-anchor="middle">弱相关</text>

  <rect x="250" y="394" width="220" height="120" fill="#e0f2fe"/>
  <text x="360" y="440" fill="#075985" font-size="13" text-anchor="middle">口型同步校验</text>
  <text x="360" y="466" fill="#0c4a6e" font-size="13" text-anchor="middle">由动画反推对白节奏</text>

  <rect x="250" y="514" width="220" height="120" fill="#e0f2fe"/>
  <text x="360" y="560" fill="#075985" font-size="13" text-anchor="middle">音色转换 / 克隆</text>
  <text x="360" y="586" fill="#0c4a6e" font-size="13" text-anchor="middle">降噪 · 修复 · 升采样</text>

  <!-- Music column -->
  <rect x="470" y="154" width="220" height="120" fill="#f1f5f9"/>
  <text x="580" y="220" fill="#94a3b8" font-size="14" text-anchor="middle">不适用</text>

  <rect x="470" y="274" width="220" height="120" fill="#ede9fe"/>
  <text x="580" y="312" fill="#5b21b6" font-size="13" text-anchor="middle">主要场景</text>
  <text x="580" y="340" fill="#4c1d95" font-size="13" text-anchor="middle">循环 bed · 分层 stem</text>
  <text x="580" y="366" fill="#4c1d95" font-size="13" text-anchor="middle">stinger · 过场成曲</text>

  <rect x="470" y="394" width="220" height="120" fill="#ede9fe"/>
  <text x="580" y="440" fill="#5b21b6" font-size="13" text-anchor="middle">按键位同步配乐</text>
  <text x="580" y="466" fill="#4c1d95" font-size="13" text-anchor="middle">过场音乐与画面同步</text>

  <rect x="470" y="514" width="220" height="120" fill="#ede9fe"/>
  <text x="580" y="560" fill="#5b21b6" font-size="13" text-anchor="middle">分轨（stem separation）</text>
  <text x="580" y="586" fill="#4c1d95" font-size="13" text-anchor="middle">风格迁移 · 段落延展</text>

  <!-- SFX column -->
  <rect x="690" y="154" width="220" height="120" fill="#f1f5f9"/>
  <text x="800" y="220" fill="#94a3b8" font-size="14" text-anchor="middle">不适用</text>

  <rect x="690" y="274" width="220" height="120" fill="#fef3c7"/>
  <text x="800" y="312" fill="#92400e" font-size="13" text-anchor="middle">主要场景</text>
  <text x="800" y="340" fill="#78350f" font-size="13" text-anchor="middle">音效 · 环境 bed · UI</text>
  <text x="800" y="366" fill="#78350f" font-size="13" text-anchor="middle">多变体抗重复疲劳</text>

  <rect x="690" y="394" width="220" height="120" fill="#fef3c7"/>
  <text x="800" y="432" fill="#92400e" font-size="13" text-anchor="middle">最有价值的组合</text>
  <text x="800" y="458" fill="#78350f" font-size="13" text-anchor="middle">拟音 Foley：脚步 · 布料</text>
  <text x="800" y="484" fill="#78350f" font-size="13" text-anchor="middle">碰撞 · 开门 · 技能</text>

  <rect x="690" y="514" width="220" height="120" fill="#fef3c7"/>
  <text x="800" y="560" fill="#92400e" font-size="13" text-anchor="middle">音色替换 / 拟音改造</text>
  <text x="800" y="586" fill="#78350f" font-size="13" text-anchor="middle">素材库的风格统一</text>

  <!-- system column -->
  <rect x="910" y="154" width="220" height="120" fill="#d1fae5"/>
  <text x="1020" y="200" fill="#065f46" font-size="13" text-anchor="middle">运行时动态对白</text>
  <text x="1020" y="226" fill="#064e3b" font-size="13" text-anchor="middle">LLM 生成文本</text>
  <text x="1020" y="248" fill="#064e3b" font-size="13" text-anchor="middle">→ 实时 TTS 播出</text>

  <rect x="910" y="274" width="220" height="120" fill="#d1fae5"/>
  <text x="1020" y="340" fill="#065f46" font-size="13" text-anchor="middle">离线素材生产</text>
  <text x="1020" y="366" fill="#064e3b" font-size="13" text-anchor="middle">需版本管理与台账</text>

  <rect x="910" y="394" width="220" height="120" fill="#d1fae5"/>
  <text x="1020" y="440" fill="#065f46" font-size="13" text-anchor="middle">TTV → V2A 串接</text>
  <text x="1020" y="466" fill="#064e3b" font-size="13" text-anchor="middle">先出动画预览</text>
  <text x="1020" y="488" fill="#064e3b" font-size="13" text-anchor="middle">再生成同步音频</text>

  <rect x="910" y="514" width="220" height="120" fill="#d1fae5"/>
  <text x="1020" y="560" fill="#065f46" font-size="13" text-anchor="middle">入库前标准化</text>
  <text x="1020" y="586" fill="#064e3b" font-size="13" text-anchor="middle">响度 / 采样率 / 循环点</text>

  <!-- footer note -->
  <rect x="30" y="656" width="1120" height="44" rx="10" fill="#0f172a"/>
  <text x="590" y="683" fill="#e2e8f0" font-size="13" text-anchor="middle">关键结论：Text-to-Video 不直接产出音频，但它 + V2A 打破了「没有实拍画面就无法拟音」的瓶颈</text>
</svg>
